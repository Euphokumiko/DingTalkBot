name: B站动态推送

on:
  schedule:
    - cron: '*/30 * * * *'  # 每30分钟运行一次，可修改
  push:
    branches: [ master ]
  watch:
    types: [started]

jobs:
  push:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        
      - name: 设置Python环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          
      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install requests
          
      - name: 运行推送脚本
        env:
          SECRET: ${{ secrets.SECRET }}
          TOKEN: ${{ secrets.TOKEN }}
          MIDS: ${{ secrets.MIDS }}
        run: python run.py
